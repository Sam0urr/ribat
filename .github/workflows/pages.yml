# Publishes web/ to GitHub Pages so the map lives at the repo root URL
# (<user>.github.io/ribat/) rather than /ribat/web/.
#
# Enable once: Settings -> Pages -> Source: "GitHub Actions".
name: Deploy map to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # The gate. Publishing used to race the checks: both workflows started on the
  # same push and never spoke, so a commit that failed verification still went
  # live and the red X arrived afterwards, next to a broken map. Calling
  # verify.yml rather than repeating its steps keeps one definition of
  # "verified", and runs it against this exact commit.
  verify:
    uses: ./.github/workflows/verify.yml

  # When the gate fails this job is skipped, no artifact is uploaded, and the
  # previously deployed site stays up untouched. A failed build publishes
  # nothing rather than publishing something wrong.
  deploy:
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
