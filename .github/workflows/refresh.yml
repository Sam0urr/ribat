name: Monthly data refresh

# The GPR workbook is republished on the first business day of each month, and
# slips when that day is a US federal holiday. Rather than guess the date, run
# every day of the first week and exit without committing when the data is
# unchanged — which is also what happens on every run after the real update.
on:
  schedule:
    - cron: '17 12 1-7 * *'
  workflow_dispatch:
    inputs:
      force_publish:
        description: >-
          Commit and publish even when the workbook is unchanged. Exercises the
          commit/push/deploy path on demand instead of waiting for a real
          vintage; costs one commit carrying nothing but rebuild timestamps.
        type: boolean
        default: false

# contents: write to commit the new vintage; pages/id-token to publish it.
# Publishing from this run rather than leaving it to pages.yml is deliberate:
# GitHub does not start new workflow runs for pushes made with the built-in
# GITHUB_TOKEN, so the push below would never wake the deploy workflow and a
# fresh vintage would sit in the repository, unpublished, until a human pushed
# something unrelated.
permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.check.outputs.changed }}
      publish: ${{ steps.check.outputs.publish }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # verify.py downgrades its `node --check` of the inline script to a
      # warning when node is absent, so a runner without it would wave through
      # a syntax error in index.html. Same reasoning as verify.yml.
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: pip install --quiet -r requirements.txt

      - name: Download GPR workbook
        run: |
          mkdir -p data/raw
          curl -sSL --fail --retry 3 --retry-delay 10 \
            -o data/raw/data_gpr_export.xls \
            https://www.matteoiacoviello.com/gpr_files/data_gpr_export.xls
          file data/raw/data_gpr_export.xls

      # Only 01 and 03 run monthly. The dependency weights (02, 02b, 02c) are
      # benchmark-year cross-sections committed to the repo; refetching 300+
      # WITS/OECD responses every month for annual data would be abuse.
      - name: Rebuild index
        run: |
          python3 pipeline/01_load_gpr.py
          python3 pipeline/03_build_intensity.py
          python3 pipeline/04_validate.py

      # Compare the DATA, not the file: every payload carries a build timestamp,
      # so a plain `git diff` would report a change on every single run and
      # commit noise forever. Hashing the country series also catches the
      # revisions to prior months that Iacoviello warns about, not just a new
      # month appearing.
      - name: Detect a genuine new vintage
        id: check
        run: |
          python3 - <<'PY'
          import hashlib, json, os, subprocess
          def digest(txt):
              d = json.loads(txt)
              return hashlib.sha256(json.dumps(
                  {"m": d["months"], "c": d["countries"]}, sort_keys=True
              ).encode()).hexdigest()
          new = digest(open("web/data/gpr.json").read())
          try:
              old = digest(subprocess.check_output(
                  ["git", "show", "HEAD:web/data/gpr.json"], text=True))
          except subprocess.CalledProcessError:
              old = None
          changed = new != old
          forced = os.environ.get("FORCE_PUBLISH") == "true"
          publish = changed or forced
          print(f"previous {old}\ncurrent  {new}\n"
                f"changed  {changed}\nforced   {forced}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"changed={'true' if changed else 'false'}\n")
              f.write(f"publish={'true' if publish else 'false'}\n")
          with open("web/data/gpr.json") as f:
              f2 = json.load(f)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              state = ("new vintage, publishing" if changed else
                       "unchanged, forced publish" if forced else
                       "unchanged, nothing to publish")
              f.write(f"GPR data through **{f2['months'][-1]}** — {state}\n")
          PY
        env:
          FORCE_PUBLISH: ${{ inputs.force_publish }}

      # Run the repository's own invariants against the vintage about to be
      # published, before it is committed. Failing here leaves main untouched
      # and the live site on the previous vintage, which is the safe direction:
      # a month of stale data beats a month of wrong data.
      - name: Verify the new vintage
        if: steps.check.outputs.publish == 'true'
        run: python3 .claude/skills/ribat-verify/verify.py

      - name: Commit and publish
        if: steps.check.outputs.publish == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # README.md carries the generated provenance block, which 01 rewrites
          # from the payload it just built. Leaving it out would publish a new
          # vintage under the previous vintage's digest, and the verifier would
          # fail on the next run against a README nobody had touched.
          # web/data/validation.json is 04's summary of the report figures,
          # which web/story.html reads at load; without it the story page would
          # quote the previous vintage's numbers under the new data.
          git add -f web/data/gpr.json web/data/intensity.json \
                     web/data/validation.json \
                     data/processed/validation_report.txt README.md
          MONTH=$(python3 -c "import json;print(json.load(open('web/data/gpr.json'))['months'][-1])")

          # A forced run must not leave history claiming a vintage arrived when
          # none did. It also has nothing to say beyond rebuild timestamps, so
          # when the staged tree is identical there is nothing to commit and the
          # run proceeds straight to republishing the unchanged site.
          if [ "${{ steps.check.outputs.changed }}" = "true" ]; then
            git commit -m "Data refresh: GPR through ${MONTH}

          Automated monthly rebuild. Latest months are preliminary and subject
          to revision as delayed newspaper editions enter the search database."
            git push
          elif git diff --cached --quiet; then
            echo "Forced run: staged tree is identical, nothing to commit."
          else
            git commit -m "Rebuild timestamps: GPR still through ${MONTH}

          Forced run with no new vintage. The data is unchanged; this carries
          only the timestamps a rebuild rewrites, and exists to exercise the
          commit and publish path on demand."
            git push
          fi

      # Upload from this workspace, not from a fresh checkout: these are the
      # exact files the checks above just passed on.
      - uses: actions/upload-pages-artifact@v3
        if: steps.check.outputs.publish == 'true'
        with:
          path: web

  # Separate job only because deploy-pages requires the github-pages
  # environment. Skipped entirely on the runs that find no new vintage, which
  # is most of them.
  deploy:
    needs: refresh
    if: needs.refresh.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
